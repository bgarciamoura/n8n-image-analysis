# Ambiente completo para a atividade A3 (n8n + banco) rodando em containers.
#
#   cp .env.example .env            # e ajuste os valores
#   docker compose up -d            # sobe n8n em http://localhost:5678
#   docker compose --profile import run --rm n8n-import   # importa o fluxo (opcional)
#   docker compose --profile test up -d mailpit           # SMTP fake p/ testes (opcional)
#
# O modelo (Cloudflare Workers AI) e o envio real de e-mail (SMTP do seu provedor)
# são serviços externos; as credenciais são cadastradas dentro do n8n.

services:
  postgres:
    image: postgres:16-alpine
    container_name: a3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    container_name: a3-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # --- Banco de dados ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # --- Acesso / URLs (Form Trigger e webhooks usam WEBHOOK_URL) ---
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      N8N_EDITOR_BASE_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      # Permite abrir o editor via http (sem HTTPS) a partir de outro host/IP
      N8N_SECURE_COOKIE: "false"
      # --- Segurança: chave que criptografa as credenciais salvas (NÃO perca!) ---
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Defina N8N_ENCRYPTION_KEY no .env}
      # --- Binários (imagens) em disco em vez de memória; payload até 16 MB ---
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_PAYLOAD_SIZE_MAX: 16
      N8N_FORMDATA_FILE_SIZE_MAX: 16
      # --- Diversos ---
      GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
      TZ: ${TZ:-America/Sao_Paulo}
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      # Fluxo da atividade disponível dentro do container para importação
      - ./n8n-workflow-analise-imagem-email.json:/workflows/n8n-workflow-analise-imagem-email.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Serviço one-shot: importa o fluxo desta pasta para o n8n.
  # Uso: docker compose --profile import run --rm n8n-import
  n8n-import:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    profiles: ["import"]
    entrypoint: ["n8n"]
    command: ["import:workflow", "--input=/workflows/n8n-workflow-analise-imagem-email.json"]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflow-analise-imagem-email.json:/workflows/n8n-workflow-analise-imagem-email.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # SMTP fake para testar o e-mail ANTES do envio real (substitui o Ethereal usado em aula).
  # Uso: docker compose --profile test up -d mailpit  ->  caixa em http://localhost:8025
  # No n8n, credencial SMTP: host "mailpit", porta 1025, sem SSL/TLS, sem usuário/senha.
  mailpit:
    image: axllent/mailpit:latest
    container_name: a3-mailpit
    profiles: ["test"]
    restart: unless-stopped
    ports:
      - "8025:8025"   # interface web
      - "1025:1025"   # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  postgres_data:
  n8n_data:
